version: 2.1

jobs:
  react-app:
    docker:
      - image: cimg/node:25.8
    environment:
      CI: "true"
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Build
          command: npm run build
      - run:
          name: Test
          command: npm test -- --watchAll=false

workflows:
  build-and-test:
    jobs:
      - react-app
